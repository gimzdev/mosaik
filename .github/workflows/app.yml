# The app: Rust engine and Tauri shell, the React interface. Runs when app files change.
name: App

on:
  push:
    branches: [master, v1-build]
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "deny.toml"
      - ".cargo/**"
      - "installer/**"
      - "mosaik.ps1"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES.txt"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "deny.toml"
      - ".cargo/**"
      - "installer/**"
      - "mosaik.ps1"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES.txt"
      - ".github/workflows/app.yml"

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy -p mosaik-core -p mosaik-ipc --all-targets --all-features -- -D warnings
      - run: cargo test -p mosaik-core -p mosaik-ipc --all-features

  windows:
    name: Windows (engine, Win32, overlays, app, package)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: rustup show
      # The steps the owner runs, with Windows PowerShell 5.1 as people will. Each stops the job
      # when it fails (a script's last exit code is what counts otherwise).
      - name: mosaik.ps1 build
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File mosaik.ps1 build; if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: mosaik.ps1 test (engine tests, clippy, interface checks and tests)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File mosaik.ps1 test; if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: mosaik.ps1 package (the Store package)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File mosaik.ps1 package; if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: mosaik.ps1 pack, then unpack the copy and check it matches the repository
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File mosaik.ps1 pack; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File target\mosaik.ps1 verify .; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File target\mosaik.ps1 unpack "$env:RUNNER_TEMP\unpacked"; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File target\mosaik.ps1 verify "$env:RUNNER_TEMP\unpacked"; if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: mosaik
          path: |
            target/mosaik.ps1
            target/msix/*.msix
          if-no-files-found: error

  interface:
    name: Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests in a browser, with accessibility checks
        run: npm run e2e
      - run: npm audit --omit=dev --audit-level=high

  dependencies:
    name: Dependency policy and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: rustup show
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check
      # THIRD-PARTY-NOTICES.txt lists the licences of exactly what ships.
      - run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - run: npm ci --no-audit --no-fund
        working-directory: apps/desktop
      - run: node installer/notices.mjs --check
