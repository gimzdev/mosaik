# The app: Rust engine and Tauri shell, the React interface. Runs when app files change.
name: App

on:
  push:
    branches: [master, v1-build]
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "deny.toml"
      - ".cargo/**"
      - "installer/**"
      - "mosaik.ps1"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES.txt"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "deny.toml"
      - ".cargo/**"
      - "installer/**"
      - "mosaik.ps1"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES.txt"
      - ".github/workflows/app.yml"

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy -p mosaik-core -p mosaik-ipc --all-targets --all-features -- -D warnings
      - run: cargo test -p mosaik-core -p mosaik-ipc --all-features

  windows:
    name: Windows (engine, Win32, overlays, app)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Interface build (the app embeds it)
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: rustup show
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --no-fail-fast -p mosaik-core -p mosaik-ipc -p mosaik-win -p mosaik-overlay -p mosaik-engine --all-features
      - run: cargo build --release -p mosaik-desktop -p mosaik-watchdog -p mosaik-ipc
      # The one-file app, made and checked with Windows PowerShell 5.1 as people will run it.
      - name: Pack mosaik.ps1, unpack it and check it matches the repository
        shell: powershell
        run: |
          # Each step stops the job when it fails (only the last exit code counts otherwise).
          powershell -NoProfile -ExecutionPolicy Bypass -File mosaik.ps1 pack; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File target\mosaik.ps1 verify .; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File target\mosaik.ps1 unpack "$env:RUNNER_TEMP\unpacked"; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File target\mosaik.ps1 verify "$env:RUNNER_TEMP\unpacked"; if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: The Store package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\msix\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: mosaik
          path: |
            target/mosaik.ps1
            target/msix/*.msix
          if-no-files-found: error

  interface:
    name: Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests in a browser, with accessibility checks
        run: npm run e2e
      - run: npm audit --omit=dev --audit-level=high

  dependencies:
    name: Dependency policy and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: rustup show
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check
      # THIRD-PARTY-NOTICES.txt lists the licences of exactly what ships.
      - run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - run: npm ci --no-audit --no-fund
        working-directory: apps/desktop
      - run: node installer/notices.mjs --check
