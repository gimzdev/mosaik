# The site, generated by mosaik1.sh. Runs when the script changes.
name: Site

on:
  push:
    branches: [master, v1-build]
    paths:
      - "mosaik1.sh"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "mosaik1.sh"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bash mosaik1.sh --build --dir "$RUNNER_TEMP/site"
