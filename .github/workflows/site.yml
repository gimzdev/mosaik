# The site, generated by mosaik.sh. Runs when the script changes.
name: Site

on:
  push:
    branches: [master, v1-build]
    paths:
      - "mosaik.sh"
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "mosaik.sh"
      - "site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate, check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Lint the script
        run: shellcheck mosaik.sh
      # Into site/ itself: run from the repository's root, the script writes ./mosaik_site, and
      # the check below compared site/ with nothing.
      - name: Generate and build site/, as the owner does
        run: bash mosaik.sh --build --dir site
      - name: site/ is exactly what mosaik.sh writes
        run: |
          drift="$(git status --porcelain -- site ':!site/package-lock.json')"
          if [ -n "$drift" ]; then
            echo "site/ differs from what mosaik.sh writes. Change the script, not site/, then run it again:"
            echo "$drift"
            exit 1
          fi
      - name: Audit the site's dependencies
        run: npm audit --audit-level=high
        working-directory: site
      - name: Build in a fresh folder, as on another machine
        run: bash mosaik.sh --build --dir "$RUNNER_TEMP/site"
