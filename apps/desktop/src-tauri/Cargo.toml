[package]
name = "mosaik-desktop"
description = "Mosaïk for Windows: the engine, the tray icon and the interface windows (Tauri)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "mosaik"

[[bin]]
name = "mosaik"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
mosaik-core.workspace = true
mosaik-engine.workspace = true
mosaik-ipc.workspace = true
mosaik-win.workspace = true
# custom-protocol: the interface is embedded in mosaik.exe (app.rs refuses to build without it).
tauri = { version = "2.12.3", features = ["custom-protocol", "tray-icon"] }

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"]

[lints]
workspace = true
