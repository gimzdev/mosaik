[package]
name = "mosaik-probe"
description = "Measurements behind Mosaïk's design decisions (docs/adr). Re-run before each release."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mosaik-core.workspace = true
serde_json.workspace = true
# MOSAIK_LOG=debug prints what the engine under test decides (to stderr).
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
mosaik-engine.workspace = true
mosaik-ipc.workspace = true
mosaik-win.workspace = true
mosaik-overlay.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
