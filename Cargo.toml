[workspace]
resolver = "3"
members = [
    "crates/mosaik-core",
    "crates/mosaik-ipc",
    "crates/mosaik-win",
    "crates/mosaik-overlay",
    "crates/mosaik-watchdog",
    "crates/mosaik-probe",
    "crates/mosaik-engine",
    "apps/desktop/src-tauri",
]
# The crates above build everywhere; the Windows-only ones compile to empty libraries elsewhere,
# so `cargo test` works on Linux and macOS for the pure logic.
default-members = ["crates/mosaik-core", "crates/mosaik-ipc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "CC0-1.0"
repository = "https://github.com/gimzdev/mosaik"
publish = false

[workspace.dependencies]
mosaik-core = { path = "crates/mosaik-core" }
mosaik-ipc = { path = "crates/mosaik-ipc" }
mosaik-win = { path = "crates/mosaik-win" }
mosaik-overlay = { path = "crates/mosaik-overlay" }
mosaik-engine = { path = "crates/mosaik-engine" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
windows = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
float_cmp = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
